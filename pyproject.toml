[project]
name = "cmf-watch-utils"
version = "0.1.0"
description = "CMF Watch Utils: tooling and documentation for CMF Watch and other smartwatches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cmf-watch-fwkit",
  "bleak>=3.0.2",
  "pycryptodome>=4.0.1",
]

[project.scripts]
cmf-watch-utils = "cmf_watch_utils.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmf_watch_utils"]

[tool.uv.sources]
cmf-watch-fwkit = { workspace = true }

[tool.uv.workspace]
members = ["tooling", "tools"]

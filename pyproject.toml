[project]
name = "cmf-watch-utils"
version = "0.1.0"
description = "CMF Watch Utils: tooling and documentation for CMF Watch and other smartwatches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cmf-watch-fwkit",
  "bleak>=3.0.2",
  "pycryptodome>=4.0.1",
]

[tool.uv]
package = false

[tool.uv.sources]
cmf-watch-fwkit = { workspace = true }

[tool.uv.workspace]
members = ["tooling", "tools"]

[project]
name = "cmf-watch-fwkit"
version = "0.1.0"
description = "Offline firmware, AOTA, SDFS, RES, STY, WFDL and AJS toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "capstone>=5.0.9",
  "lz4>=4.4.5",
  "pillow>=13.0.0",
]

[project.scripts]
fwkit = "fwkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwkit"]

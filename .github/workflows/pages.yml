name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'emulator/**'
      - '.github/workflows/emulator-wasm.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  wasm:
    uses: ./.github/workflows/emulator-wasm.yml
    permissions:
      contents: read

  build:
    needs: wasm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: pnpm build

      - uses: actions/download-artifact@v4
        with:
          name: wp2-wasm-experimental
          path: wasm-output

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Prepare stock firmware for the browser
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb-multiarch gcc-arm-none-eabi libglib2.0-0 libpixman-1-0 libfdt1 libpulse0
          bash emulator/web/prepare-stock.sh

      - name: Prepare firmware presets
        env:
          BAD_APPLE_TAG: ${{ vars.WP2_BAD_APPLE_TAG || 'v0.1.0' }}
          BAD_APPLE_SHA256: ${{ vars.WP2_BAD_APPLE_SHA256 || '563b993656f8ebfc21d4e79e9eb7eb3c8b6ce483fcfbdb10198cffecfd8c4a88' }}
        run: |
          args=()
          [[ "$BAD_APPLE_TAG" =~ ^[A-Za-z0-9._-]+$ && "$BAD_APPLE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          http_status=$(curl -LsS --retry 3 -o browser-stock/bad-apple.bin -w '%{http_code}' \
            "https://github.com/arnav-kr/firmware-wp2-badapple/releases/download/$BAD_APPLE_TAG/wp2-badapple-ota.bin")
          if [[ "$http_status" == 200 ]]; then
            printf '%s  %s\n' "$BAD_APPLE_SHA256" browser-stock/bad-apple.bin | sha256sum -c
            args+=(--bad-apple browser-stock/bad-apple.bin)
          elif [[ "$http_status" != 404 ]]; then
            printf 'Firmware download failed (HTTP %s)\n' "$http_status" >&2
            exit 1
          fi
          uv run --locked python emulator/web/prepare-presets.py --output browser-stock/presets "${args[@]}"

      - name: Add browser emulator
        run: python3 emulator/web/publish.py --runtime wasm-output --stock browser-stock/staged --presets browser-stock/presets --output site/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
